{% extends "base.html" %}

{% block page_title %}Error - BAS Assistant{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl">
    <div class="card rounded-3xl border border-red-200 bg-white p-8 shadow-sm dark:border-red-900/50 dark:bg-gray-800">
        <div class="flex items-start gap-4">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-300">
                <i class="fas fa-triangle-exclamation text-xl"></i>
            </div>
            <div class="min-w-0">
                <p class="text-xs font-semibold uppercase tracking-[0.2em] text-red-500">Request Error</p>
                <h1 class="mt-2 text-2xl font-bold text-gray-900 dark:text-white">{{ error_title }}</h1>
                <p class="mt-3 text-sm leading-6 text-gray-600 dark:text-gray-300">{{ error_message }}</p>
                <div class="mt-6 flex flex-wrap gap-3">
                    <a href="/" class="btn-primary">Return Home</a>
                    {% if project %}
                    <a href="/project/{{ project.metadata.project_id }}" class="btn-secondary">Back To Project</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
